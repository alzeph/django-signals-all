[project]
name = "django-signals-all"
version = "0.1.0"
description = "Signaux Django garantis pour les opérations bulk et le SQL brut"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "django>=4.2",
    "sqlglot>=25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_signals_all"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "psycopg[binary]>=3.1",
    "mysqlclient>=2.2",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
