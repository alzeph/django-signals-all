name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres, mysql]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: django_signals_all
          POSTGRES_USER: django_signals_all
          POSTGRES_PASSWORD: django_signals_all
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: django_signals_all
          MYSQL_ROOT_PASSWORD: django_signals_all
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Create secondary database (postgres)
        if: matrix.db == 'postgres'
        run: |
          PGPASSWORD=django_signals_all psql -h localhost -U django_signals_all \
            -c "CREATE DATABASE django_signals_all_secondary"

      - name: Create secondary database (mysql)
        if: matrix.db == 'mysql'
        run: |
          mysql -h 127.0.0.1 -uroot -pdjango_signals_all \
            -e "CREATE DATABASE IF NOT EXISTS django_signals_all_secondary"

      - run: uv sync --locked

      - name: Run tests
        env:
          DSA_TEST_DB: ${{ matrix.db }}
        run: |
          uv run pytest \
            --cov=django_signals_all --cov-report=term-missing --cov-fail-under=100

  test-django-versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        django-version: ["4.2", "5.0", "5.1", "5.2"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Run tests against Django ${{ matrix.django-version }} (SQLite)
        run: uv run --with "django==${{ matrix.django-version }}.*" pytest

  test-python-versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --python ${{ matrix.python-version }}
      - run: uv run pytest

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, test-django-versions, test-python-versions]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv build
